version: 2
updates:
- package-ecosystem: npm
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  directories:
  - '*'
  groups:
    # React requires react and react-dom to have the exact same version:
    # bump them (and their types) together in a single pull request.
    react:
      patterns:
      - react
      - react-dom
      - '@types/react'
      - '@types/react-dom'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
